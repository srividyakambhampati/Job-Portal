<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Home</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-briefcase-fill text-primary me-2"></i>JobPortal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav ms-auto align-items-center" id="navbar-items">
                    <!-- Auth buttons injected here -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section text-center text-white d-flex align-items-center"
        style="min-height: 60vh; background: linear-gradient(135deg, #0d6efd, #6610f2);">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Find Your Dream Job</h1>
            <p class="lead mb-5">Search jobs by title and location</p>

            <!-- Search Bar -->
            <div class="search-bar bg-white p-3 rounded-pill shadow-lg mx-auto" style="max-width: 700px;">
                <div class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <input type="text" id="searchInput" class="form-control border-0"
                            placeholder="Job title or keyword">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="locationInput" class="form-control border-0" placeholder="Location">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100 rounded-pill fw-bold"
                            onclick="filterJobs()">Search</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Jobs Section -->
    <div class="container mt-5 pt-4">
        <div class="d-flex justify-content-between mb-3">
            <h4 class="fw-bold">Latest Jobs</h4>
            <span class="text-muted"><span id="job-count">0</span> jobs found</span>
        </div>

        <div class="row" id="job-list">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let allJobs = [];

        // Load jobs on page load
        document.addEventListener("DOMContentLoaded", async () => {
            updateNavbarState();
            fetchJobs();
        });

        // Toggle Navbar Buttons depending on Login Status
        function updateNavbarState() {
            const navbarItems = document.getElementById("navbar-items");
            const token = localStorage.getItem("token");

            if (token) {
                navbarItems.innerHTML = `
                    <li class="nav-item me-3">
                        <a class="nav-link fw-medium" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <button onclick="handleLogout()" class="btn btn-outline-danger btn-sm rounded-pill px-4">Logout</button>
                    </li>
                `;
            } else {
                navbarItems.innerHTML = `
                    <li class="nav-item me-2">
                        <a class="btn btn-link text-decoration-none text-dark fw-medium" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary btn-sm rounded-pill px-4" href="register.html">Sign Up</a>
                    </li>
                `;
            }
        }

        // Home-page specific logout
        function handleLogout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.reload();
        }

        async function fetchJobs(keyword = '', location = '') {
            const jobList = document.getElementById("job-list");
            jobList.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>`;

            try {
                let url = `/api/jobs?keyword=${encodeURIComponent(keyword)}&location=${encodeURIComponent(location)}`;
                const res = await fetch(url);
                const jobs = await res.json();
                console.log(`Fetched ${jobs.length} jobs`);
                displayJobs(jobs);
            } catch (error) {
                console.error('Error fetching jobs:', error);
                jobList.innerHTML =
                    `<div class="alert alert-danger text-center">Failed to load jobs. Check console for details.</div>`;
            }
        }

        // Display jobs
        function displayJobs(jobs) {
            const jobList = document.getElementById("job-list");
            const jobCount = document.getElementById("job-count");

            jobCount.innerText = jobs.length;
            jobList.innerHTML = "";

            if (jobs.length === 0) {
                jobList.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <h5>No jobs found</h5>
                        <p>Try adjusting your search criteria</p>
                    </div>`;
                return;
            }

            jobs.forEach(job => {
                const date = new Date(job.createdAt).toLocaleDateString();
                jobList.innerHTML += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 border-0 shadow-sm job-card">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div class="job-icon bg-light rounded p-2">
                                        <i class="bi bi-building text-primary fs-4"></i>
                                    </div>
                                    <span class="badge rounded-pill bg-light text-primary border border-primary-subtle">${job.jobType}</span>
                                </div>
                                <h5 class="fw-bold mb-1">${job.title}</h5>
                                <p class="text-primary mb-3 small fw-semibold">${job.company}</p>
                                
                                <div class="d-flex align-items-center text-muted mb-2 small">
                                    <i class="bi bi-geo-alt me-2"></i> ${job.location}
                                </div>
                                <div class="d-flex align-items-center text-muted mb-3 small">
                                    <i class="bi bi-currency-dollar me-2"></i> ${job.salary || "Negotiable"}
                                </div>
                                
                                <p class="card-text text-muted mb-4 small line-clamp">
                                    ${job.description.substring(0, 120)}...
                                </p>
                                
                                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                    <span class="text-muted extra-small"><i class="bi bi-clock me-1"></i> ${date}</span>
                                    <a href="job-details.html?id=${job._id}" class="btn btn-primary btn-sm px-4 rounded-pill">View Details</a>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // Filter jobs
        function filterJobs() {
            const keyword = document.getElementById("searchInput").value.trim();
            const location = document.getElementById("locationInput").value.trim();
            fetchJobs(keyword, location);
        }
    </script>

</body>

</html>
