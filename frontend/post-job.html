<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-briefcase-fill text-primary me-2"></i>JobPortal
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                                <i class="bi bi-plus-circle text-primary fs-2"></i>
                            </div>
                            <h2 class="fw-bold">Post a New Opening</h2>
                            <p class="text-muted">Fill in the details below to find your next talent.</p>
                        </div>
                        <form id="post-job-form">
                            <div class="mb-3">
                                <label for="title" class="form-label">Job Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="company" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="company" required>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="salary" class="form-label">Salary</label>
                                    <input type="text" class="form-control" id="salary" placeholder="e.g. $50k - $80k">
                                </div>
                                <div class="col-md-6">
                                    <label for="jobType" class="form-label">Job Type</label>
                                    <select class="form-select" id="jobType">
                                        <option value="Full-time">Full-time</option>
                                        <option value="Part-time">Part-time</option>
                                        <option value="Contract">Contract</option>
                                        <option value="Internship">Internship</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="5" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Post Job</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Protect route
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || (user.role !== 'employer' && user.role !== 'admin')) {
            window.location.href = 'index.html';
        }

        document.getElementById('post-job-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const jobData = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                location: document.getElementById('location').value,
                salary: document.getElementById('salary').value,
                jobType: document.getElementById('jobType').value,
                description: document.getElementById('description').value
            };

            try {
                await api.postJob(jobData);
                showAlert('Job posted successfully!', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });
    </script>
</body>

</html>
